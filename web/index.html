<!doctype html>
<html lang="fr" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dernier Abri — JEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffcf6b;--blue:#7fb2ff;--red:#ff5a5a;--green:#7dff9a;--ink:#e8e6df;--panel:rgba(10,12,18,.62);--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05070c;color:var(--ink);font-family:"Share Tech Mono",ui-monospace,monospace;overflow:hidden}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;z-index:5}
  .vignette{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
  .damage{inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(190,0,0,.55) 100%);opacity:0;transition:opacity .35s}
  .crosshair{left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
  .crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 6px rgba(0,0,0,.8)}
  .crosshair::before{left:12px;top:0;width:2px;height:26px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
  .crosshair::after{top:12px;left:0;height:2px;width:26px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%)}
  .top{left:20px;top:18px;display:flex;gap:14px;align-items:stretch}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
  .label{font-size:11px;letter-spacing:.14em;opacity:.55;text-transform:uppercase}
  .big{font-family:"Bebas Neue",sans-serif;font-size:34px;line-height:1;letter-spacing:.04em}
  .mode{color:var(--gold)}
  .pv{display:flex;gap:3px;margin-top:6px}.pv i{width:12px;height:16px;border-radius:2px;background:var(--red);box-shadow:0 0 8px rgba(255,90,90,.6)}.pv i.off{background:#2a2a2f;box-shadow:none}
  .ammo{right:24px;bottom:22px;text-align:right}
  .bullets{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}.bullets i{width:8px;height:24px;border-radius:4px 4px 1px 1px;background:linear-gradient(#ffe39a,#c08a2c)}.bullets i.off{background:#2a2a2f}
  .brain{right:20px;top:18px;width:300px}
  .brain h3{font-family:"Bebas Neue";font-weight:400;letter-spacing:.08em;font-size:22px;color:var(--blue);margin-bottom:6px}
  .row{display:flex;justify-content:space-between;font-size:13px;margin:2px 0}.row b{font-weight:400;color:#fff}
  .decision{margin-top:8px;font-size:15px}.decision b{color:var(--gold)}
  .bar{position:relative;height:18px;margin-top:5px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;font-size:12px}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);opacity:.55;transition:width .15s}
  .bar .fill.fire{background:var(--gold);opacity:.9}
  .bar em{position:relative;font-style:normal;padding:0 7px;line-height:18px;display:flex;justify-content:space-between}
  .feed{left:20px;bottom:22px;width:440px;display:flex;flex-direction:column-reverse;gap:4px}
  .feed div{background:var(--panel);border-left:3px solid var(--gold);padding:5px 10px;font-size:13px;border-radius:0 6px 6px 0;animation:in .25s ease}
  .feed div.bad{border-color:var(--red)}.feed div.good{border-color:var(--green)}
  @keyframes in{from{opacity:0;transform:translateX(-12px)}}
  .tag{position:fixed;transform:translate(-50%,-100%);font-size:12px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.55);white-space:nowrap;pointer-events:none;z-index:4}
  .tag.target{outline:2px solid var(--gold)}
  .tag.z{background:rgba(190,40,40,.85)}.tag.h{background:rgba(40,150,80,.85)}.tag.u{background:rgba(70,80,110,.85)}
  .rules{margin-top:8px;font-size:11px;line-height:1.5;opacity:.7}
  .shout{left:50%;top:22%;transform:translateX(-50%);font-family:"Bebas Neue";font-size:42px;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 18px rgba(0,0,0,.9);opacity:0;transition:opacity .25s;white-space:nowrap}
  .tag.reveal{font-family:"Bebas Neue";font-size:20px;letter-spacing:.05em;background:none;text-shadow:0 0 8px #000}
  .tip{left:50%;top:calc(50% + 28px);transform:translateX(-50%);max-width:420px;text-align:center;font-size:13px;background:var(--panel);padding:6px 10px;border-radius:6px;display:none}
  .screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,40,70,.55),rgba(3,4,8,.92))}
  .box{width:min(760px,calc(100vw - 32px));text-align:center}
  .title{font-family:"Bebas Neue";font-size:clamp(56px,10vw,110px);letter-spacing:.06em;line-height:.9;color:#fff;text-shadow:0 0 40px rgba(255,90,90,.35)}
  .title small{display:block;font-size:.28em;letter-spacing:.3em;color:var(--gold);margin-top:10px}
  .lead{margin:22px auto 26px;max-width:600px;line-height:1.6;opacity:.85;font-size:15px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .modes button{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:18px 12px;font-family:inherit;font-size:13px;line-height:1.5;transition:.15s}
  .modes button:hover:not(:disabled){border-color:var(--gold);background:rgba(255,207,107,.08);transform:translateY(-2px)}
  .modes button:disabled{opacity:.35;cursor:not-allowed}
  .modes button strong{display:block;font-family:"Bebas Neue";font-weight:400;font-size:30px;letter-spacing:.06em;color:#fff}
  .lang{display:inline-flex;gap:4px;margin-bottom:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:4px}
  .lang button{pointer-events:auto;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit;font-size:13px;padding:5px 14px;border-radius:999px;opacity:.6}
  .lang button.on{background:var(--gold);color:#111;opacity:1}
  .legend span{margin:0 9px}
  .legend{display:flex;gap:18px;justify-content:center;margin-top:22px;font-size:12px;opacity:.75;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
  .stats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stats b{display:block;font-family:"Bebas Neue";font-size:36px;font-weight:400}
  .hidden{display:none!important}
  @media (max-width:820px){.brain,.feed{display:none}.modes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div class="hud vignette"></div>
<div class="hud damage" id="damage"></div>
<div class="hud crosshair"></div>
<div class="hud tip" id="tip"></div>
<div class="hud shout" id="shout" data-i18n="cri"></div>

<div class="hud top">
  <div class="card"><div class="label" data-i18n="mode">Mode</div><div class="big mode" id="mode">—</div></div>
  <div class="card"><div class="label" data-i18n="temps">Temps</div><div class="big" id="timer">120</div></div>
  <div class="card"><div class="label" data-i18n="abri">Abri</div><div class="pv" id="pv"></div></div>
  <div class="card"><div class="label">Score</div><div class="big" id="score">0</div></div>
</div>

<div class="hud card brain" id="brain">
  <h3 data-i18n="cerveau">Cerveau JEV</h3>
  <div class="row"><span data-i18n="seuilLbl">Seuil de tir (↑/↓)</span><b id="seuil">0.50</b></div>
  <div class="row"><span data-i18n="latence">Latence</span><b id="lat">—</b></div>
  <div class="row"><span data-i18n="appels">Appels / tokens</span><b id="calls">0 / 0</b></div>
  <div class="row" id="errRow" style="color:var(--red)"></div>
  <div class="decision"><span data-i18n="decision">Décision :</span> <b id="dec">—</b></div>
  <div id="bars"></div>
  <div class="rules" id="rules" data-i18n="regles"></div>
</div>

<div class="hud card ammo"><div class="label" id="ammoLbl">Munitions</div><div class="bullets" id="bullets"></div></div>
<div class="hud feed" id="feed"></div>
<div id="tags"></div>

<div class="screen" id="start">
  <div class="box">
    <div class="lang"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <div class="title" data-i18n="titre"></div>
    <p class="lead" data-i18n="intro"></p>
    <div class="modes">
      <button data-mode="jev" class="needJev" data-i18n="b1"></button>
      <button data-mode="jev1" class="needJev" data-i18n="b2"></button>
      <button data-mode="regle" data-i18n="b3"></button>
      <button data-mode="manuel" data-i18n="b4"></button>
    </div>
    <div class="legend" data-i18n="legende"></div>
  </div>
</div>

<div class="screen hidden" id="end">
  <div class="box">
    <div class="title" id="endTitle"><span data-i18n="fin">FIN DE PARTIE</span><small id="endSub"></small></div>
    <div class="stats" id="endStats"></div>
    <div class="modes">
      <button data-mode="jev" class="again needJev"><strong>JEV v2</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="jev1" class="again needJev"><strong>JEV v1</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="regle" class="again"><strong>Bot</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="manuel" class="again"><strong data-i18n="toi">Toi</strong><span data-i18n="rejouer"></span></button>
    </div>
    <p class="lead" style="margin-top:18px" data-i18n="enregistre"></p>
  </div>
</div>

<script type="module">
import * as THREE from "three";

// ================= Réglages =================
const DUREE = 120, PV_MAX = 10, MUNITIONS = 6, RECHARGE = 1.4, CADENCE = 0.3;
const MAX_CIBLES = 5, PORTEE = 60, SPAWN_Z = -72, BARRICADE_Z = -4.4;
const chanceTouche = d => Math.max(0.15, Math.min(0.95, 1 - d / 60));
const PORTEE_SOMMATION = 45, DELAI_REACTION = 1.0, COOLDOWN_SOMMATION = 2.5;
const REACTION_I18N = {
  fr: { humain: "s'arrête immédiatement et lève les deux mains", blesse_humain: "s'arrête et lève sa main valide en criant « je suis vivant ! »",
        zombie: "ne réagit pas et continue d'avancer vers l'abri", blesse_zombie: "tourne la tête vers le bruit puis continue d'avancer sans s'arrêter" },
  en: { humain: "stops immediately and raises both hands", blesse_humain: "stops and raises their good hand shouting \"I'm alive!\"",
        zombie: "does not react and keeps walking toward the shelter", blesse_zombie: "turns its head toward the noise then keeps walking without stopping" },
};
// Tous les textes de l'interface ET des questions envoyées à JEV
const TXT = {
  fr: {
    mode: "Mode", temps: "Temps", abri: "Abri", cerveau: "Cerveau JEV", seuilLbl: "Seuil de tir (↑/↓)", latence: "Latence", appels: "Appels / tokens",
    decision: "Décision :", regles: "Règles de tir : p(zombie) ≥ seuil · 2 questions cohérentes · réaction à la sommation lue · pas les mains en l'air · ligne de tir dégagée",
    cri: "📢 STOP ! LEVEZ LES MAINS !", titre: "DERNIER ABRI<small>Une IA décide qui vit · v2.2</small>",
    intro: "Les zombies marchent vers ta barricade. Des survivants courent aussi vers toi, et certains blessés ressemblent à s'y méprendre à des infectés. <b>JEV ne voit pas l'image</b> : il lit seulement la description de chaque silhouette et décide <b>sur qui tirer, et quand</b>.",
    b1: "<strong>1 · JEV v2</strong>Protocole sûr : classe,<br>somme, puis tire.", b2: "<strong>2 · JEV v1</strong>Ancienne méthode :<br>1 question « sur qui tirer ».",
    b3: "<strong>3 · Bot</strong>Règle naïve : tire sur<br>le plus proche.", b4: "<strong>4 · Toi</strong>Souris pour viser,<br>clic pour tirer.",
    legende: "<span>1–4 changer de mode</span><span>↑/↓ seuil JEV</span><span>L langue</span><span>R rejouer</span><span>Échap menu</span>",
    fin: "FIN DE PARTIE", rejouer: "Rejouer", toi: "Toi", enregistre: "Partie enregistrée dans <b>resultats_parties.csv</b>",
    modes: { jev: "JEV v2", jev1: "JEV v1", regle: "BOT NAÏF", manuel: "TOI" },
    noms: { zombie: "ZOMBIE", blesse_zombie: "ZOMBIE BLESSÉ", humain: "HUMAIN", blesse_humain: "HUMAIN BLESSÉ" },
    erreur: "ERREUR", rate: "raté", recharge: "Rechargement…", munitions: "Munitions", tirerSur: "tirer sur ", attendre: "attendre",
    sommation: "📢 SOMMATION : « Stop ! Levez les mains ! »", bloque: id => `⛔ ${id} : tir bloqué, un survivant est dans la ligne de tir`,
    morsure: id => `MORSURE ! ${id} a atteint la barricade`, sauve: id => `${id} est à l'abri · +15`,
    tombe: "L'abri est tombé", tenu: "Tu as tenu jusqu'au bout", pasCle: "Pas de clé API", err: "Erreur : ",
    stats: ["Score", "Zombies tués", "Humains sauvés", "Humains abattus", "Morsures", "Précision", "Appels JEV", "Sommations"],
    contexte: "Contexte : un défenseur protège un abri. Une sommation « Stop ! Levez les mains ! » est criée aux silhouettes qui approchent : un survivant humain obéit, un zombie l'ignore.",
    fiche: (c, r) => `Cible ${c.id}. Description : ${c.desc}. Réaction à la sommation : ${r ?? "sommation pas encore faite"}.`,
    qZ: "Cette cible est un zombie (infecté hostile).", qH: "Cette cible est un survivant humain vivant.",
    v1Crit: c => `Tirer sur ${c.id} : ${c.desc} (${Math.round(c.distance)} m, chance ${Math.round(chanceTouche(c.distance) * 100)} % de toucher)`,
    v1Wait: "Ne pas tirer maintenant (cible humaine, trop loin ou trop incertaine)",
    v1Instr: "Tu défends un abri contre des zombies. Des survivants humains courent aussi vers l'abri : ne JAMAIS tirer sur un humain. Les munitions sont limitées : un tir de loin rate souvent. Choisis la meilleure action maintenant.",
  },
  en: {
    mode: "Mode", temps: "Time", abri: "Shelter", cerveau: "JEV Brain", seuilLbl: "Fire threshold (↑/↓)", latence: "Latency", appels: "Calls / tokens",
    decision: "Decision:", regles: "Rules of engagement: p(zombie) ≥ threshold · 2 consistent questions · reaction to the warning read · hands not raised · clear line of fire",
    cri: "📢 STOP! HANDS UP!", titre: "LAST SHELTER<small>An AI decides who lives · v2.2</small>",
    intro: "Zombies are walking toward your barricade. Survivors are running toward you too, and some wounded people look just like the infected. <b>JEV can't see the image</b>: it only reads each figure's description and decides <b>who to shoot, and when</b>.",
    b1: "<strong>1 · JEV v2</strong>Safe protocol: classify,<br>warn, then fire.", b2: "<strong>2 · JEV v1</strong>Old method:<br>1 question \"who to shoot\".",
    b3: "<strong>3 · Bot</strong>Naive rule: shoots<br>the closest one.", b4: "<strong>4 · You</strong>Mouse to aim,<br>click to shoot.",
    legende: "<span>1–4 switch mode</span><span>↑/↓ JEV threshold</span><span>L language</span><span>R replay</span><span>Esc menu</span>",
    fin: "GAME OVER", rejouer: "Play again", toi: "You", enregistre: "Game saved to <b>resultats_parties.csv</b>",
    modes: { jev: "JEV v2", jev1: "JEV v1", regle: "NAIVE BOT", manuel: "YOU" },
    noms: { zombie: "ZOMBIE", blesse_zombie: "WOUNDED ZOMBIE", humain: "HUMAN", blesse_humain: "WOUNDED HUMAN" },
    erreur: "ERROR", rate: "missed", recharge: "Reloading…", munitions: "Ammo", tirerSur: "shoot ", attendre: "wait",
    sommation: "📢 WARNING: \"Stop! Hands up!\"", bloque: id => `⛔ ${id}: shot blocked, a survivor is in the line of fire`,
    morsure: id => `BITE! ${id} reached the barricade`, sauve: id => `${id} is safe · +15`,
    tombe: "The shelter has fallen", tenu: "You held out to the end", pasCle: "No API key", err: "Error: ",
    stats: ["Score", "Zombies killed", "Humans saved", "Humans shot", "Bites", "Accuracy", "JEV calls", "Warnings"],
    contexte: "Context: a defender protects a shelter. A warning \"Stop! Hands up!\" is shouted at approaching figures: a human survivor obeys, a zombie ignores it.",
    fiche: (c, r) => `Target ${c.id}. Description: ${c.desc}. Reaction to the warning: ${r ?? "no warning given yet"}.`,
    qZ: "This target is a zombie (hostile infected).", qH: "This target is a living human survivor.",
    v1Crit: c => `Shoot ${c.id}: ${c.desc} (${Math.round(c.distance)} m, ${Math.round(chanceTouche(c.distance) * 100)} % chance to hit)`,
    v1Wait: "Don't shoot now (human target, too far or too uncertain)",
    v1Instr: "You defend a shelter against zombies. Human survivors are also running toward the shelter: NEVER shoot a human. Ammo is limited: long shots often miss. Choose the best action now.",
  },
};
const tr = () => TXT[LANG];
function appliquerLangue(l) {
  LANG = l; try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e => e.innerHTML = tr()[e.dataset.i18n]);
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  if (partie) $("mode").textContent = tr().modes[partie.mode];
}

// ================= Langues (FR / EN) =================
let LANG = "fr";
try { LANG = localStorage.getItem("lang") || (navigator.language?.startsWith("fr") ? "fr" : "en"); } catch {}
const DESC_I18N = {
  fr: {
    zombie: ["démarche lente et saccadée, grogne, bras tendus", "peau grise, mâchoire pendante, avance sans s'arrêter",
             "trébuche, ne cligne pas des yeux, gémissement continu"],
    humain: ["court vers l'abri en criant « aidez-moi ! »", "fait de grands signes avec les bras, porte un sac à dos",
             "court en zigzag, appelle ses amis par leur prénom"],
    blesse_zombie: ["boite, ensanglanté, ne répond pas quand on l'appelle", "ensanglanté, tête penchée, avance en ligne droite sans parler"],
    blesse_humain: ["boite, ensanglanté, tient son bras et dit « ne tirez pas »", "ensanglanté, avance lentement en levant une main ouverte"],
  },
  en: {
    zombie: ["slow jerky walk, grunts, arms stretched out", "grey skin, slack jaw, keeps walking without stopping",
             "stumbles, never blinks, constant groaning"],
    humain: ["runs toward the shelter shouting \"help me!\"", "waves both arms, carries a backpack",
             "runs in a zigzag, calls out to friends by name"],
    blesse_zombie: ["limping, bloodied, doesn't respond when called", "bloodied, head tilted, walks in a straight line without speaking"],
    blesse_humain: ["limping, bloodied, holds their arm and says \"don't shoot\"", "bloodied, walks slowly raising an open hand"],
  },
};
const estZombie = n => n === "zombie" || n === "blesse_zombie";
const pick = a => a[Math.floor(Math.random() * a.length)];

// ================= Rendu =================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
const PARAMS = new URLSearchParams(location.search);
const LITE = PARAMS.has("lite");                                     // ?lite = PC lent
const SPEED = +PARAMS.get("speed") || 1;                             // ?speed=4 : accéléré (tests)
renderer.setPixelRatio(LITE ? 0.75 : Math.min(devicePixelRatio, 1.5));   // M1 / GTX 1060 : on plafonne
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = !LITE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e18);
scene.fog = new THREE.FogExp2(0x0a0e18, 0.024);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = "YXZ";
camera.position.set(0, 1.65, 0);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0x51618a, 0x120c08, 0.55));
const lune = new THREE.DirectionalLight(0xa9bcff, 0.9);
lune.position.set(-18, 32, -30);
lune.target.position.set(0, 0, -30);
lune.castShadow = true;
lune.shadow.mapSize.set(1024, 1024);
Object.assign(lune.shadow.camera, { left: -16, right: 16, top: 45, bottom: -45, near: 1, far: 90 });
scene.add(lune, lune.target);

const lampe = new THREE.SpotLight(0xfff0d0, 38, 70, 0.32, 0.5, 1.4);   // lampe torche fixée à l'arme
lampe.position.set(0.2, -0.1, -0.9);
camera.add(lampe, lampe.target);
lampe.target.position.set(0, 0, -10);

// ---------- Textures procédurales (aucun fichier externe) ----------
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const asphalte = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#1b1c20"; g.fillRect(0, 0, w, h);

class Perso {
  constructor(id, nature) {

    const z = estZombie(nature), blesse = nature.startsWith("blesse");
    const peau = z && !blesse ? MAT.peauZ : blesse ? MAT.peauB : pick(MAT.peaux);
    const habit = z && !blesse ? MAT.habitZ : blesse ? MAT.habitB : pick(MAT.chemises);
    const pant = z && !blesse ? MAT.pantZ : MAT.jean;
    this.root = new THREE.Group(); this.corps = new THREE.Group(); this.root.add(this.corps);
    const mesh = (geo, mat, x, y, zz, parent = this.corps) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, zz); m.castShadow = true; m.userData.perso = this; parent.add(m); return m; };
    const pivot = (x, y) => { const p = new THREE.Group(); p.position.set(x, y, 0); this.corps.add(p); return p; };
    this.jg = pivot(-.12, .9); this.jd = pivot(.12, .9); mesh(G.jambe, pant, 0, 0, 0, this.jg); mesh(G.jambe, pant, 0, 0, 0, this.jd);
    mesh(G.torse, habit, 0, 1.23, 0);
    this.cou = pivot(0, 1.56); mesh(G.tete, peau, 0, .17, 0, this.cou);
    this.bg = pivot(-.33, 1.52); this.bd = pivot(.33, 1.52); mesh(G.bras, peau, 0, 0, 0, this.bg); mesh(G.bras, peau, 0, 0, 0, this.bd);

    if (nature === "blesse_zombie") {            // indice visuel discret, invisible pour JEV (il ne lit que la description)

    const vit = { zombie: 1.5, humain: 4.6, blesse_zombie: 1.2, blesse_humain: 1.2 }[nature];
    this.vitesse = vit * (0.85 + Math.random() * 0.35) * (1 + partie.t / DUREE * 0.6);

  }
  update(dt) {

      this.bg.rotation.x = -s * .9; this.bd.rotation.x = s * .9;

      this.jg.rotation.x = s * .35; this.jd.rotation.x = -s * .2;
      this.bg.rotation.x = -.5; this.bd.rotation.x = n === "blesse_humain" && this.descIdx === 1 ? -2.5 : s * .2;
      this.corps.rotation.z = Math.max(0, s) * .12; this.cou.rotation.x = .35;
    }

  }
  get nom() { return tr().noms[this.nature]; }
  tuer() { this.vivant = false; this.tag.className = "tag reveal"; this.tag.textContent = this.nom + (estZombie(this.nature) ? " ✓" : " ✗"); this.tag.style.color = estZombie(this.nature) ? "var(--green)" : "var(--red)"; }

}

async function demanderJEVsimple(cibles) {   // v1 : une seule question « sur qui tirer ? »
  jevStats.busy = true;
  const criteria = {};
  for (const c of cibles) criteria[c.id] = tr().v1Crit(c);
  criteria.attendre = tr().v1Wait;
  const payload = { model: "jev-latest",
    state: { pv_abri: partie.pv, munitions: partie.mun, rechargement_en_cours: partie.t < partie.rechargeFin,
      cibles: cibles.map(c => ({ id: c.id, description: c.desc, distance_m: Math.round(c.distance), chance_de_toucher: +chanceTouche(c.distance).toFixed(2) })) },
    questions: { action: { type: "choice", criteria,
      instructions: tr().v1Instr } } };
  const mode = partie.mode;
  try {
    const r = await (await fetch("/jev", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })).json();
    if (r.error) throw new Error(r.error);
    if (partie.mode !== mode) return;
    const a = r.answers.action;
    jevStats.appels++; jevStats.tokens += r.usage?.input_tokens || 0; jevStats.lat.push(r.latence_ms); jevStats.err = "";
    jevStats.probas = a.probabilities; jevStats.choix = a.choice;
    // JEV peut changer d'avis à chaque réponse : on vise sa cible SEULEMENT si p >= seuil
    const p = a.choice !== "attendre" && a.probabilities[a.choice] >= seuil
      ? partie.persos.find(p => p.id === a.choice && p.vivant) : null;
    if (p) p.pDecision = a.probabilities[a.choice];
    partie.cible = p || null;
  } catch (e) { jevStats.err = tr().err + e.message; await new Promise(r => setTimeout(r, 800)); }
  finally { jevStats.busy = false; }
}
// ---- v2 : JEV CLASSE, le CODE décide (règles explicites) ----
async function classerJEV(cibles) {
  jevStats.busy = true;
  cibles.forEach(c => c.besoinAnalyse = false);
  const questions = {};
  for (const c of cibles) {
    const fiche = tr().fiche(c, c.reaction);
    // deux questions formulées en sens inverse : si JEV est cohérent, p(zombie) ≈ 1 - p(humain)
    questions["z_" + c.id] = { type: "noul", instructions: `${fiche} ${tr().qZ}` };
    questions["h_" + c.id] = { type: "noul", instructions: `${fiche} ${tr().qH}` };
  }
  const avecReaction = new Map(cibles.map(c => [c, !!c.reaction]));   // ce que JEV a VRAIMENT lu
  const payload = { model: "jev-latest", questions,
    state: { langue: LANG, contexte: tr().contexte, cibles: cibles.map(c => ({ id: c.id, description: c.desc, distance_m: Math.round(c.distance), reaction_sommation: c.reaction })) } };
  const mode = partie.mode;
  try {
    const r = await (await fetch("/jev", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })).json();
    if (r.error) throw new Error(r.error);
    if (partie.mode !== mode) return;
    jevStats.appels++; jevStats.tokens += r.usage?.input_tokens || 0; jevStats.lat.push(r.latence_ms); jevStats.err = "";
    for (const c of cibles) {
      const z = r.answers["z_" + c.id]?.noul, h = r.answers["h_" + c.id]?.noul;
      if (z == null || h == null) { c.besoinAnalyse = true; continue; }
      c.pZ = (z + (1 - h)) / 2; c.incoh = Math.abs(z - (1 - h)); c.lectures++;
      if (avecReaction.get(c)) c.lueAvecReaction = true; else c.pAvant = c.pZ;
      if (c.yeux && c.lueAvecReaction) c.yeux.forEach(m => m.material = MAT.oeilZ);   // l'infecté se trahit
      majStatut(c);
    }
  } catch (e) { cibles.forEach(c => c.besoinAnalyse = true); jevStats.err = tr().err + e.message; await new Promise(r => setTimeout(r, 800)); }
  finally { jevStats.busy = false; }
}
function majStatut(c) {
  if (c.pZ == null) return;
  c.statut = c.incoh > .15 ? "incertain" : c.pZ >= seuil ? "zombie" : c.pZ <= .25 ? "humain" : "incertain";
}
function sommation() {
  partie.derniereSommation = partie.t; partie.stats.sommations++;
  partie.persos.filter(p => p.vivant && p.distance < PORTEE_SOMMATION).forEach(p => p.sommer());
  $("shout").style.opacity = 1; setTimeout(() => $("shout").style.opacity = 0, 900);
  onde(); bip(); feed(tr().sommation);
}
// Ligne de tir : refuse si un non-zombie est près de la trajectoire (devant ou juste derrière la cible)
function ligneDegagee(cible) {
  const T = cible.root.position, L = Math.hypot(T.x, T.z), ux = T.x / L, uz = T.z / L;
  return !partie.persos.some(p => {
    if (p === cible || !p.vivant || p.statut === "zombie") return false;
    const P = p.root.position, proj = P.x * ux + P.z * uz, lat = Math.abs(P.x * uz - P.z * ux);
    return lat < 1.0 && proj > 0 && proj < L + 4;
  });
}
function protocole(cibles) {
  partie.persos.forEach(majStatut);                       // le seuil peut changer en direct (↑/↓)
  const aAnalyser = cibles.filter(c => c.besoinAnalyse);
  if (aAnalyser.length && !jevStats.busy) classerJEV(aAnalyser);
  // sommation dès qu'une silhouette non confirmée humaine entre dans la zone
  if (partie.t - partie.derniereSommation > COOLDOWN_SOMMATION &&
      partie.persos.some(p => p.vivant && p.sommeAt === null && p.distance < PORTEE_SOMMATION && p.statut !== "humain")) sommation();
  // règles d'engagement
  // règles d'engagement (TOUTES obligatoires, aucune exception) :
  const eligibles = cibles.filter(c =>
    c.statut === "zombie" &&            // R1 p(zombie) >= seuil
    c.incoh <= .15 &&                   // R2 les 2 questions opposées sont d'accord
    c.lueAvecReaction &&                // R3 JEV a lu la réaction à la sommation
    !c.arrete &&                        // R4 une silhouette arrêtée mains en l'air n'est jamais une cible
    (chanceTouche(c.distance) >= .5 || c.distance < 15))   // R5 tir raisonnable (pas de balle gâchée)
  .sort((a, b) => (a.distance - 4.4) / a.vitesse - (b.distance - 4.4) / b.vitesse);
  partie.cible = null;
  for (const c of eligibles) {
    if (ligneDegagee(c)) { partie.cible = c; break; }
    if (!c.bloque) { c.bloque = true; partie.stats.tirs_bloques++; feed(tr().bloque(c.id)); }
  }
}

function botNaif(cibles) {
  const c = cibles.find(c => c.distance < 30 && !(c.nature === "humain" && c.descIdx === 0));
  if (c) partie.cible = c;
}

// ================= Contrôles =================
let yaw = 0, pitch = 0;
addEventListener("mousemove", e => {
  if (partie?.mode !== "manuel" || document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * .0022; pitch -= e.movementY * .0022;
  yaw = THREE.MathUtils.clamp(yaw, -1.3, 1.3); pitch = THREE.MathUtils.clamp(pitch, -.5, .45);
});
const ray = new THREE.Raycaster();
function viseSous() {
  ray.setFromCamera({ x: 0, y: 0 }, camera);
  const hit = ray.intersectObjects(partie.persos.filter(p => p.vivant).map(p => p.root), true)[0];
  return hit?.object.userData.perso;
}
addEventListener("mousedown", () => {
  if (!partie || partie.fini || partie.mode !== "manuel") return;
  if (document.pointerLockElement !== renderer.domElement) return renderer.domElement.requestPointerLock?.();
  if (peutTirer()) { const p = viseSous(); tirer(p, !!p, "TOI"); }
});
addEventListener("keydown", e => {
  if (e.key === "l" || e.key === "L") appliquerLangue(LANG === "fr" ? "en" : "fr");
  if (e.key === "ArrowUp") seuil = Math.min(.95, +(seuil + .05).toFixed(2));
  if (e.key === "ArrowDown") seuil = Math.max(.05, +(seuil - .05).toFixed(2));
  if (e.key === "1" && cfg.jev) nouvellePartie("jev");
  if (e.key === "2" && cfg.jev) nouvellePartie("jev1");
  if (e.key === "3") nouvellePartie("regle");
  if (e.key === "4") nouvellePartie("manuel");
  if ((e.key === "r" || e.key === "R") && partie) nouvellePartie(partie.mode);
  if (e.key === "Escape" && partie) { partie.fini = true; $("start").classList.remove("hidden"); }
});
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => appliquerLangue(b.dataset.lang)));
document.querySelectorAll("button[data-mode]").forEach(b => b.addEventListener("click", () => nouvellePartie(b.dataset.mode)));

// ================= Son (synthétisé) =================
let actx;
function audio() { actx ??= new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); }
function bang() {
  if (!actx) return;
  const len = actx.sampleRate * .25, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = .5;
  src.connect(f).connect(g).connect(actx.destination); src.start();
}

function bip() {
  if (!actx) return;
  [0, .18].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = i ? 660 : 880; g.gain.setValueAtTime(.08, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d + .16);
    o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .17); });
}
const ondes = [];
const ondeMat = new THREE.MeshBasicMaterial({ color: 0xffcf6b, transparent: true, side: THREE.DoubleSide, depthWrite: false });
function onde() { const m = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 64), ondeMat.clone()); m.rotation.x = -Math.PI / 2; m.position.y = .05; scene.add(m); ondes.push({ m, t: 0 }); }

// ================= HUD =================
function hud() {
  const s = partie.stats;
  $("timer").textContent = Math.max(0, Math.ceil(DUREE - partie.t));
  $("score").textContent = score(s);
  $("pv").innerHTML = Array.from({ length: PV_MAX }, (_, i) => `<i class="${i < partie.pv ? "" : "off"}"></i>`).join("");
  const recharge = partie.t < partie.rechargeFin;
  $("ammoLbl").textContent = recharge ? tr().recharge : tr().munitions;
  $("bullets").innerHTML = Array.from({ length: MUNITIONS }, (_, i) => `<i class="${!recharge && i < partie.mun ? "" : "off"}"></i>`).join("");
  if (partie.mode.startsWith("jev")) {
    $("seuil").textContent = seuil.toFixed(2);
    const l = jevStats.lat; $("lat").textContent = l.length ? Math.round(l.slice(-10).reduce((a, b) => a + b, 0) / Math.min(10, l.length)) + " ms" : "—";
    $("calls").textContent = `${jevStats.appels} / ${jevStats.tokens}`;
    $("errRow").textContent = jevStats.err;
    if (partie.mode === "jev") {
      $("dec").textContent = partie.cible ? tr().tirerSur + partie.cible.id : tr().attendre;
      const ico = { zombie: "🧟", humain: "🛡️", incertain: "❓", analyse: "…" };
      $("bars").innerHTML = visibles().map(c => {
        const pz = c.pZ ?? 0, cls = c.statut === "zombie" ? "fire" : "";
        const col = c.statut === "humain" ? "background:var(--green)" : "";
        return `<div class="bar"><i class="fill ${cls}" style="width:${pz * 100}%;${col}"></i><em><span>${ico[c.statut]} ${c.id} ${c.lueAvecReaction ? "📢✓" : c.sommeAt !== null ? "📢…" : ""}</span><span>${c.pZ == null ? "—" : "p(z)=" + pz.toFixed(2)}${c.incoh > .15 ? " ⚠" : ""}</span></em></div>`;
      }).join("");
      return;
    }
    $("dec").textContent = jevStats.choix;
    $("bars").innerHTML = Object.entries(jevStats.probas).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, p]) =>
      `<div class="bar"><i class="fill ${k !== "attendre" && p >= seuil ? "fire" : ""}" style="width:${p * 100}%"></i><em><span>${k}</span><span>${p.toFixed(2)}</span></em></div>`).join("");
  }
}
const v = new THREE.Vector3();
function tags() {
  const vus = new Set(visibles());
  for (const p of partie.persos) {
    v.set(p.root.position.x, 2.05, p.root.position.z).project(camera);
    const ok = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 && (p.vivant ? vus.has(p) : p.mort < 2.5);
    p.tag.style.display = ok ? "" : "none";
    if (!ok) continue;
    p.tag.style.left = (v.x * .5 + .5) * innerWidth + "px"; p.tag.style.top = (-v.y * .5 + .5) * innerHeight + "px";
    if (p.vivant) {
      p.tag.classList.toggle("target", p === partie.cible);
      if (partie.mode === "jev") {
        p.tag.classList.toggle("z", p.statut === "zombie"); p.tag.classList.toggle("h", p.statut === "humain");
        p.tag.classList.toggle("u", p.statut === "incertain" || p.statut === "analyse");
        p.tag.textContent = p.id + (p.pZ == null ? " …" : ` ${Math.round(p.pZ * 100)}%`);
      }
    }
  }
}

function journal(p, issue) {
  if (!partie.mode.startsWith("jev")) return;
  fetch("/decision", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
    mode: partie.mode, langue: LANG, seuil, id: p.id, verite: estZombie(p.nature) ? "zombie" : "humain", nature: p.nature, description: p.desc,
    reaction: p.reaction ?? "", p_zombie_avant_sommation: p.pAvant?.toFixed(3) ?? "", p_zombie_final: p.pZ?.toFixed(3) ?? "",
    incoherence: p.incoh?.toFixed(3) ?? "", statut_jev: p.statut, issue, distance_m: Math.round(p.distance) }) }).catch(() => {});
}

function finPartie() {
  partie.fini = true; document.exitPointerLock?.();
  const s = partie.stats, l = jevStats.lat;
  $("endSub").textContent = (partie.pv <= 0 ? tr().tombe : tr().tenu) + ` · mode ${$("mode").textContent}`;
  const vals = [score(s), s.zombies_tues, s.humains_sauves, s.humains_tues, s.morsures, s.tirs ? Math.round((1 - s.rates / s.tirs) * 100) + " %" : "—",
    partie.mode.startsWith("jev") ? jevStats.appels : "—", partie.mode === "jev" ? s.sommations : "—"];
  const cases = tr().stats.map((k, i) => [k, vals[i]]);
  $("endStats").innerHTML = cases.map(([k, v]) => `<div><span class="label">${k}</span><b>${v}</b></div>`).join("");
  $("end").classList.remove("hidden");
  fetch("/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
    mode: partie.mode, langue: LANG, seuil: partie.mode.startsWith("jev") ? seuil : "", score: score(s), ...s, survie_s: Math.round(partie.t),
    appels_jev: jevStats.appels, latence_moy_ms: l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length) : "" }) }).catch(() => {});
}

// ================= Boucle =================
const clock = new THREE.Clock();
const tmpQ = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05) * SPEED, t = clock.elapsedTime;
  lampadaires[1].intensity = Math.random() < .03 ? 2 : 22;           // lampadaire qui grésille
  dust.rotation.y = Math.sin(t * .05) * .05; dust.position.y = Math.sin(t * .3) * .2;

  if (partie && !partie.fini) {
    partie.t += dt;
    if (partie.t >= partie.prochainSpawn) { spawn(); partie.prochainSpawn = partie.t + Math.max(.65, 2.3 - partie.t / 55); }
    partie.persos = partie.persos.filter(p => {
      const garde = p.update(dt);
      if (p.vivant && p.root.position.z >= BARRICADE_Z - .2) {
        p.vivant = false; p.mort = 9; journal(p, estZombie(p.nature) ? "morsure" : "sauve");
        if (estZombie(p.nature)) { partie.pv--; partie.stats.morsures++; shake = .5; $("damage").style.opacity = 1; setTimeout(() => $("damage").style.opacity = 0, 250); feed(tr().morsure(p.id), "bad"); }
        else { partie.stats.humains_sauves++; feed(tr().sauve(p.id), "good"); }
        p.detruire(); return false;
      }
      if (!garde) p.detruire();
      return garde;
    });
    if (partie.cible && !partie.cible.vivant) partie.cible = null;

    const cibles = visibles();
    if (partie.mode === "jev" && cfg.jev) protocole(cibles);
    if (partie.mode === "jev1" && cfg.jev && !jevStats.busy && cibles.length) demanderJEVsimple(cibles);
    if (partie.mode === "regle" && !partie.cible) botNaif(cibles);

    // visée automatique (JEV / bot) : la caméra tourne vers la cible puis tire
    if (partie.mode !== "manuel" && partie.cible) {
      const c = partie.mode === "jev" ? partie.cible.viseeTete : partie.cible.visee, dx = c.x - camera.position.x, dz = c.z - camera.position.z;
      const ty = Math.atan2(-dx, -dz), tp = Math.atan2(c.y - camera.position.y, Math.hypot(dx, dz));
      yaw += (ty - yaw) * Math.min(1, dt * 9); pitch += (tp - pitch) * Math.min(1, dt * 9);
      if (Math.abs(ty - yaw) < .03 && Math.abs(tp - pitch) < .03 && peutTirer()) {
        const cible = partie.cible;
        tirer(cible, Math.random() < chanceTouche(cible.distance), { jev: "JEV v2", jev1: "JEV v1", regle: "BOT" }[partie.mode]);
        if (!cible.vivant || partie.mode === "regle") partie.cible = null;
      }
    } else if (partie.mode !== "manuel") { yaw *= 1 - dt; pitch *= 1 - dt; }

    if (partie.mode === "manuel") {
      const p = viseSous(); $("tip").style.display = p ? "block" : "none";
      if (p) $("tip").textContent = `${p.id} · ${Math.round(p.distance)} m · « ${p.desc} »`;
    } else $("tip").style.display = "none";

    if (partie.pv <= 0 || partie.t >= DUREE) finPartie();
    hud(); tags();
  }

  // caméra, recul, tremblement
  shake = Math.max(0, shake - dt); recul = Math.max(0, recul - dt * 7);
  camera.rotation.set(pitch + recul * .04 + (Math.random() - .5) * shake * .05, yaw + (Math.random() - .5) * shake * .05, 0);
  const rech = partie && partie.t < partie.rechargeFin;
  arme.position.set(BASE_ARME.x, BASE_ARME.y - (rech ? .18 : 0) + Math.sin(t * 1.6) * .004, BASE_ARME.z + recul * .08);
  arme.rotation.x = rech ? -.6 : recul * .15;
  flashMat.opacity = Math.max(0, flashMat.opacity - dt * 18); flashLight.intensity = Math.max(0, flashLight.intensity - dt * 400);
  for (let i = ondes.length - 1; i >= 0; i--) { const o = ondes[i]; o.t += dt; o.m.scale.setScalar(1 + o.t * 30); o.m.material.opacity = Math.max(0, 1 - o.t / 1.4); if (o.t > 1.4) { scene.remove(o.m); ondes.splice(i, 1); } }
  for (let i = tracers.length - 1; i >= 0; i--) { const tr = tracers[i]; tr.t -= dt; tr.line.material.opacity = tr.t / .09; if (tr.t <= 0) { scene.remove(tr.line); tr.line.geometry.dispose(); tracers.splice(i, 1); } }
  renderer.render(scene, camera);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

fetch("/config").then(r => r.json()).then(c => { cfg = c; if (!c.jev) document.querySelectorAll(".needJev").forEach(b => { b.disabled = true; b.title = tr().pasCle; }); }).catch(() => {});
appliquerLangue(LANG);
window.__debug = { get partie() { return partie; }, jevStats, nouvellePartie, visibles };
frame();
</script>
