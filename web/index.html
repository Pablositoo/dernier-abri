<!doctype html>
<html lang="fr" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jeton-session" content="__JETON_SESSION__">
<title>Dernier Abri — JEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffcf6b;--blue:#7fb2ff;--red:#ff5a5a;--green:#7dff9a;--ink:#e8e6df;--panel:rgba(10,12,18,.62);--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05070c;color:var(--ink);font-family:"Share Tech Mono",ui-monospace,monospace;overflow:hidden}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;z-index:5}
  .vignette{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
  .damage{inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(190,0,0,.55) 100%);opacity:0;transition:opacity .35s}
  .crosshair{left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}
  .crosshair::before,.crosshair::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 6px rgba(0,0,0,.8)}
  .crosshair::before{left:12px;top:0;width:2px;height:26px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
  .crosshair::after{top:12px;left:0;height:2px;width:26px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,0 0,65% 0,100% 0,100% 100%,65% 100%)}
  .top{left:20px;top:18px;display:flex;gap:14px;align-items:stretch}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
  .label{font-size:11px;letter-spacing:.14em;opacity:.55;text-transform:uppercase}
  .big{font-family:"Bebas Neue",sans-serif;font-size:34px;line-height:1;letter-spacing:.04em}
  .mode{color:var(--gold)}
  .pv{display:flex;gap:3px;margin-top:6px}.pv i{width:12px;height:16px;border-radius:2px;background:var(--red);box-shadow:0 0 8px rgba(255,90,90,.6)}.pv i.off{background:#2a2a2f;box-shadow:none}
  .ammo{right:24px;bottom:22px;text-align:right}
  .bullets{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}.bullets i{width:8px;height:24px;border-radius:4px 4px 1px 1px;background:linear-gradient(#ffe39a,#c08a2c)}.bullets i.off{background:#2a2a2f}
  .brain{right:20px;top:18px;width:300px}
  .brain h3{font-family:"Bebas Neue";font-weight:400;letter-spacing:.08em;font-size:22px;color:var(--blue);margin-bottom:6px}
  .row{display:flex;justify-content:space-between;font-size:13px;margin:2px 0}.row b{font-weight:400;color:#fff}
  .decision{margin-top:8px;font-size:15px}.decision b{color:var(--gold)}
  .bar{position:relative;height:18px;margin-top:5px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;font-size:12px}
  .bar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);opacity:.55;transition:width .15s}
  .bar .fill.fire{background:var(--gold);opacity:.9}
  .bar em{position:relative;font-style:normal;padding:0 7px;line-height:18px;display:flex;justify-content:space-between}
  .feed{left:20px;bottom:22px;width:440px;display:flex;flex-direction:column-reverse;gap:4px}
  .feed div{background:var(--panel);border-left:3px solid var(--gold);padding:5px 10px;font-size:13px;border-radius:0 6px 6px 0;animation:in .25s ease}
  .feed div.bad{border-color:var(--red)}.feed div.good{border-color:var(--green)}
  @keyframes in{from{opacity:0;transform:translateX(-12px)}}
  .tag{position:fixed;transform:translate(-50%,-100%);font-size:12px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.55);white-space:nowrap;pointer-events:none;z-index:4}
  .tag.target{outline:2px solid var(--gold)}
  .tag.z{background:rgba(190,40,40,.85)}.tag.h{background:rgba(40,150,80,.85)}.tag.u{background:rgba(70,80,110,.85)}
  .rules{margin-top:8px;font-size:11px;line-height:1.5;opacity:.7}
  .shout{left:50%;top:22%;transform:translateX(-50%);font-family:"Bebas Neue";font-size:42px;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 18px rgba(0,0,0,.9);opacity:0;transition:opacity .25s;white-space:nowrap}
  .tag.reveal{font-family:"Bebas Neue";font-size:20px;letter-spacing:.05em;background:none;text-shadow:0 0 8px #000}
  .tip{left:50%;top:calc(50% + 28px);transform:translateX(-50%);max-width:420px;text-align:center;font-size:13px;background:var(--panel);padding:6px 10px;border-radius:6px;display:none}
  .screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,40,70,.55),rgba(3,4,8,.92))}
  .box{width:min(760px,calc(100vw - 32px));text-align:center}
  .title{font-family:"Bebas Neue";font-size:clamp(56px,10vw,110px);letter-spacing:.06em;line-height:.9;color:#fff;text-shadow:0 0 40px rgba(255,90,90,.35)}
  .title small{display:block;font-size:.28em;letter-spacing:.3em;color:var(--gold);margin-top:10px}
  .lead{margin:22px auto 26px;max-width:600px;line-height:1.6;opacity:.85;font-size:15px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .modes button{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.04);color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:18px 12px;font-family:inherit;font-size:13px;line-height:1.5;transition:.15s}
  .modes button:hover:not(:disabled){border-color:var(--gold);background:rgba(255,207,107,.08);transform:translateY(-2px)}
  .modes button:disabled{opacity:.35;cursor:not-allowed}
  .modes button strong{display:block;font-family:"Bebas Neue";font-weight:400;font-size:30px;letter-spacing:.06em;color:#fff}
  .lang{display:inline-flex;gap:4px;margin-bottom:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:4px}
  .lang button{pointer-events:auto;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit;font-size:13px;padding:5px 14px;border-radius:999px;opacity:.6}
  .lang button.on{background:var(--gold);color:#111;opacity:1}
  .legend span{margin:0 9px}
  .legend{display:flex;gap:18px;justify-content:center;margin-top:22px;font-size:12px;opacity:.75;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
  .stats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stats b{display:block;font-family:"Bebas Neue";font-size:36px;font-weight:400}
  .hidden{display:none!important}
  @media (max-width:820px){.brain,.feed{display:none}.modes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud vignette"></div>
<div class="hud damage" id="damage"></div>
<div class="hud crosshair"></div>
<div class="hud tip" id="tip"></div>
<div class="hud shout" id="shout" data-i18n="cri"></div>

<div class="hud top">
  <div class="card"><div class="label" data-i18n="mode">Mode</div><div class="big mode" id="mode">—</div></div>
  <div class="card"><div class="label" data-i18n="temps">Temps</div><div class="big" id="timer">120</div></div>
  <div class="card"><div class="label" data-i18n="abri">Abri</div><div class="pv" id="pv"></div></div>
  <div class="card"><div class="label">Score</div><div class="big" id="score">0</div></div>
</div>

<div class="hud card brain" id="brain">
  <h3 data-i18n="cerveau">Cerveau JEV</h3>
  <div class="row"><span data-i18n="seuilLbl">Seuil de tir (↑/↓)</span><b id="seuil">0.50</b></div>
  <div class="row"><span data-i18n="latence">Latence</span><b id="lat">—</b></div>
  <div class="row"><span data-i18n="appels">Appels / tokens</span><b id="calls">0 / 0</b></div>
  <div class="row" id="errRow" style="color:var(--red)"></div>
  <div class="decision"><span data-i18n="decision">Décision :</span> <b id="dec">—</b></div>
  <div id="bars"></div>
  <div class="rules" id="rules" data-i18n="regles"></div>
</div>

<div class="hud card ammo"><div class="label" id="ammoLbl">Munitions</div><div class="bullets" id="bullets"></div></div>
<div class="hud feed" id="feed"></div>
<div id="tags"></div>

<div class="screen" id="start">
  <div class="box">
    <div class="lang"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <div class="title" data-i18n="titre"></div>
    <p class="lead" data-i18n="intro"></p>
    <div class="modes">
      <button data-mode="jev" class="needJev" data-i18n="b1"></button>
      <button data-mode="jev1" class="needJev" data-i18n="b2"></button>
      <button data-mode="regle" data-i18n="b3"></button>
      <button data-mode="manuel" data-i18n="b4"></button>
    </div>
    <div class="legend" data-i18n="legende"></div>
  </div>
</div>

<div class="screen hidden" id="end">
  <div class="box">
    <div class="title" id="endTitle"><span data-i18n="fin">FIN DE PARTIE</span><small id="endSub"></small></div>
    <div class="stats" id="endStats"></div>
    <div class="modes">
      <button data-mode="jev" class="again needJev"><strong>JEV v2</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="jev1" class="again needJev"><strong>JEV v1</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="regle" class="again"><strong>Bot</strong><span data-i18n="rejouer"></span></button>
      <button data-mode="manuel" class="again"><strong data-i18n="toi">Toi</strong><span data-i18n="rejouer"></span></button>
    </div>
    <p class="lead" style="margin-top:18px" data-i18n="enregistre"></p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
